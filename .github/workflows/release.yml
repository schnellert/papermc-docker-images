name: Release

on:
  push:
    branches:
      - main
    paths:
      - "docker/Dockerfile*"
      - "docker/docker-entrypoint.sh"

  schedule:
    - cron: "0 0 * * FRI"

  workflow_dispatch:
    inputs:
      project:
        description: PaperMC project to release
        default: all
        type: choice
        options:
          - all
          - folia
          - paper
          - velocity

concurrency:
  cancel-in-progress: true
  group: ${{ github.workflow }}-${{ github.ref }}

permissions:
  contents: read

jobs:
  detect-changes:
    name: Detect Changes
    runs-on: ubuntu-26.04

    outputs:
      any: ${{ steps.detect-changes.outputs.any }}
      matrix: ${{ steps.detect-changes.outputs.matrix }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Authenticate with Docker Hub
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          username: schnellert
          password: ${{ secrets.DOCKER_HUB_PAT }}

      - name: Detect Changes
        id: detect-changes
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          PROJECT: ${{ inputs.project || 'all' }}
        with:
          script: |
            const fs = require('node:fs');
            const os = require('node:os');

            const PROJECTS = ['folia', 'paper', 'velocity'];
            const REGISTRY = 'docker.io/schnellert';
            const FILL_API = 'https://fill.papermc.io/v3/projects';

            const fetchJson = async (url) => {
              const response = await fetch(url, {
                headers: { 'User-Agent': 'github.com/schnellert/papermc-docker-images' },
              });

              if (!response.ok) throw new Error(`${url}: HTTP ${response.status}`);

              return response.json();
            };

            // Maps items with at most CONCURRENCY calls in flight, keeping the order.
            const mapConcurrent = async (items, fn) => {
              const results = new Array(items.length);
              let next = 0;

              const worker = async () => {
                while (next < items.length) {
                  const index = next++;
                  results[index] = await fn(items[index]);
                }
              };

              await Promise.all(Array.from({ length: Math.min(os.availableParallelism(), items.length) }, worker));
              return results;
            };

            const isStable = ({ channel }) => channel === 'STABLE' || channel === 'RECOMMENDED';

            // Versions are grouped upstream (e.g. "1.21" -> ["1.21.11", "1.21.10", ...]),
            // newest first. Every version with a stable build is published with its
            // newest stable build. A group without any stable build publishes the
            // newest build of its newest version instead, so it is available early.
            const listReleases = async (project) => {
              const [{ versions: groups }, { versions: metadata }] = await Promise.all([
                fetchJson(`${FILL_API}/${project}`),
                fetchJson(`${FILL_API}/${project}/versions`),
              ]);

              const javaByVersion = Object.fromEntries(
                metadata.map(({ version }) => [version.id, version.java.version.minimum]),
              );

              const versions = Object.values(groups).flat();
              const buildLists = await mapConcurrent(versions, (version) =>
                fetchJson(`${FILL_API}/${project}/versions/${version}/builds`),
              );
              const buildsByVersion = new Map(versions.map((version, i) => [version, buildLists[i]]));

              return Object.values(groups).flatMap((group) => {
                const withBuilds = group.map((version) => ({ version, builds: buildsByVersion.get(version) }));

                const stable = withBuilds
                  .map(({ version, builds }) => ({ version, build: builds.find(isStable) }))
                  .filter(({ build }) => build);

                const newest = withBuilds.find(({ builds }) => builds.length);
                const releases = stable.length
                  ? stable
                  : newest
                    ? [{ version: newest.version, build: newest.builds[0] }]
                    : [];

                return releases.map((release) => ({
                  project,
                  ...release,
                  java: javaByVersion[release.version],
                }));
              });
            };

            // Returns whether the files differ between the given commit and HEAD,
            // or null if the commit is unknown (e.g. history was rewritten).
            const filesChangedSince = async (revision, files) => {
              if (!/^[0-9a-f]{40}$/.test(revision ?? '')) return null;

              const { exitCode } = await exec.getExecOutput(
                'git',
                ['diff', '--quiet', revision, 'HEAD', '--', ...files],
                { ignoreReturnCode: true, silent: true },
              );

              return exitCode === 0 ? false : exitCode === 1 ? true : null;
            };

            const getEnv = (config, name) =>
              config?.Env?.find((entry) => entry.startsWith(`${name}=`))?.slice(name.length + 1);

            // Returns the config of every platform of a published image, keyed by
            // platform, or null if the image does not exist.
            const readImageConfigs = async (reference) => {
              const result = await exec.getExecOutput(
                'docker',
                ['buildx', 'imagetools', 'inspect', reference, '--format', '{{json .Image}}'],
                { ignoreReturnCode: true, silent: true },
              );

              if (result.exitCode !== 0) {
                if (/manifest unknown|name unknown|not found/i.test(result.stderr)) return null;
                throw new Error(`Cannot inspect ${reference}: ${result.stderr}`);
              }

              // Multi-platform images are keyed by platform, single-platform ones are not
              const images = JSON.parse(result.stdout);
              const byPlatform = images.config ? { [`${images.os}/${images.architecture}`]: images } : images;

              return Object.fromEntries(
                Object.entries(byPlatform).map(([platform, image]) => [platform, image?.config ?? {}]),
              );
            };

            const REASONS = {
              missing: 'new image',
              upstream: 'new upstream build',
              files: 'Dockerfile or entrypoint changed',
              revision: 'unknown source revision',
            };

            const jarName = (url) => url?.split('/').pop() ?? 'none';

            // Returns why an image needs to be rebuilt as { kind, detail }, or null if
            // it is up to date. kind is a key of REASONS.
            const getOutdatedReason = async (reference, { downloadUrl, files }) => {
              const configsByPlatform = await readImageConfigs(reference);
              if (!configsByPlatform) return { kind: 'missing', detail: 'not published yet' };

              for (const config of Object.values(configsByPlatform)) {
                const imageUrl = getEnv(config, 'DOWNLOAD_URL');
                if (imageUrl !== downloadUrl) {
                  return { kind: 'upstream', detail: `${jarName(imageUrl)} → ${jarName(downloadUrl)}` };
                }

                const revision = config.Labels?.['org.opencontainers.image.revision'];
                const changed = await filesChangedSince(revision, files);
                if (changed === null) return { kind: 'revision', detail: `${revision?.slice(0, 7) ?? 'none'} not in history` };
                if (changed) return { kind: 'files', detail: `since ${revision.slice(0, 7)}` };
              }

              return null;
            };

            const projects = process.env.PROJECT === 'all' ? PROJECTS : [process.env.PROJECT];
            const releases = [];
            for (const project of projects) releases.push(...(await listReleases(project)));

            const results = await mapConcurrent(releases, async ({ project, version, build, java }) => {
              const dockerfile = `docker/Dockerfile.java${java}`;

              if (!fs.existsSync(dockerfile)) {
                return { project, version, java, skipped: dockerfile };
              }

              const asset = build.downloads?.['server:default'];
              if (!asset?.url || !asset?.checksums?.sha256) {
                throw new Error(`${project} ${version}: build ${build.id} has no download URL or SHA256`);
              }

              const reason = await getOutdatedReason(`${REGISTRY}/${project}:${version}`, {
                downloadUrl: asset.url,
                files: [dockerfile, 'docker/docker-entrypoint.sh'],
              });

              return {
                project,
                version,
                java,
                reason,
                entry: { project, version, java, download: asset.url, sha256: `sha256:${asset.checksums.sha256}` },
              };
            });

            const rebuilds = results.filter(({ reason }) => reason);
            const upToDate = results.filter(({ reason, skipped }) => !reason && !skipped);
            const skipped = results.filter(({ skipped }) => skipped);
            const matrix = rebuilds.map(({ entry }) => entry);

            // Log: one collapsible group per project, one aligned line per image
            const width = Math.max(...results.map(({ version }) => version.length));

            for (const project of projects) {
              const own = results.filter((result) => result.project === project);
              const toBuild = own.filter(({ reason }) => reason).length;
              const ownSkipped = own.filter(({ skipped }) => skipped).length;
              const unchanged = own.length - toBuild - ownSkipped;

              core.startGroup(
                `${project}: ${toBuild} to build, ${unchanged} up to date` +
                  (ownSkipped ? `, ${ownSkipped} skipped` : ''),
              );
              for (const { version, java, reason, skipped } of own) {
                const status = skipped
                  ? `– skipped       ${skipped} missing`
                  : reason
                    ? `↻ rebuild       ${REASONS[reason.kind]} (${reason.detail})`
                    : '✓ up to date';
                core.info(`${version.padEnd(width)}  java ${String(java).padStart(2)}  ${status}`);
              }
              core.endGroup();
            }

            // One warning per missing Dockerfile instead of one per image
            const skippedByDockerfile = Map.groupBy(skipped, ({ skipped }) => skipped);
            for (const [dockerfile, images] of skippedByDockerfile) {
              const list = images.map(({ project, version }) => `${project} ${version}`).join(', ');
              core.warning(`${dockerfile} missing, skipped ${images.length} image(s): ${list}`);
            }

            if (matrix.length > 256) {
              throw new Error(`Build matrix has ${matrix.length} entries, GitHub allows 256`);
            }

            const countsByKind = Object.entries(Object.groupBy(rebuilds, ({ reason }) => reason.kind))
              .map(([kind, images]) => `${images.length}× ${REASONS[kind]}`)
              .join(', ');

            core.notice(
              matrix.length
                ? `${matrix.length} image(s) to build (${countsByKind}), ${upToDate.length} up to date, ${skipped.length} skipped`
                : `All ${upToDate.length} images are up to date, ${skipped.length} skipped`,
            );

            // Job summary: what gets built and why
            core.summary.addHeading('Change Detection', 2).addRaw(
              `${matrix.length} to build · ${upToDate.length} up to date · ${skipped.length} skipped`,
              true,
            );

            if (rebuilds.length) {
              core.summary.addTable([
                [
                  { data: 'Image', header: true },
                  { data: 'Java', header: true },
                  { data: 'Reason', header: true },
                  { data: 'Detail', header: true },
                ],
                ...rebuilds.map(({ project, version, java, reason }) => [
                  `${project}:${version}`,
                  String(java),
                  REASONS[reason.kind],
                  reason.detail,
                ]),
              ]);
            }

            if (skipped.length) {
              core.summary.addHeading('Skipped', 3).addList(
                [...skippedByDockerfile].map(
                  ([dockerfile, images]) =>
                    `${dockerfile} missing: ${images.map(({ project, version }) => `${project} ${version}`).join(', ')}`,
                ),
              );
            }

            await core.summary.write();

            core.setOutput('matrix', JSON.stringify({ include: matrix }));
            core.setOutput('any', String(matrix.length > 0));

  build-docker-image:
    name: Build Docker Image (${{ matrix.project }} ${{ matrix.version }})
    runs-on: ubuntu-26.04

    needs: detect-changes
    if: ${{ needs.detect-changes.outputs.any == 'true' }}

    strategy:
      fail-fast: false
      max-parallel: 3
      matrix: ${{ fromJSON(needs.detect-changes.outputs.matrix) }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build Docker Image
        uses: skriptfabrik/github-actions/build-docker-image@74c1c48bc108a4d304ca3dfec54a887ad000f132 # main
        with:
          build-args: |
            DOWNLOAD_URL=${{ matrix.download }}
            SHA256_CHECKSUM=${{ matrix.sha256 }}
          context: docker
          file: Dockerfile.java${{ matrix.java }}
          registry: docker.io
          registry-username: schnellert
          registry-password: ${{ secrets.DOCKER_HUB_PAT }}
          repository: schnellert
          name: ${{ matrix.project }}
          tags: |
            type=raw,value=${{ matrix.version }}
