name: Review

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - reopened
      - synchronize

jobs:
  changes:
    name: Detect Changes
    runs-on: ubuntu-26.04

    permissions:
      pull-requests: read

    outputs:
      files: ${{ steps.matrix.outputs.files }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Detect Changes
        id: detect-changes
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          filters: |
            build:
              - 'docker-entrypoint.sh'
              - 'Dockerfile*'

      - name: Build matrix
        id: matrix
        run: |
          if [ "${{ steps.detect-changes.outputs.build }}" = "true" ]; then
            files=$(printf '%s\n' Dockerfile* | jq -R . | jq -sc .)
          else
            files='[]'
          fi
          echo "files=$files" >> "$GITHUB_OUTPUT"

  build:
    name: Build Docker image
    runs-on: ubuntu-26.04

    permissions:
      contents: read

    needs: changes
    if: ${{ needs.changes.outputs.files != '[]' }}

    strategy:
      fail-fast: false
      matrix:
        dockerfile: ${{ fromJSON(needs.changes.outputs.files) }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build Docker image
        uses: skriptfabrik/github-actions/build-docker-image@670d01963448cb3a99765db01e55cb1af70c22e0 # main
        with:
          file: ${{ matrix.dockerfile }}
          push: "false"

  lint:
    name: Lint files
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js and pnpm
        uses: pnpm/setup@fa36a5ef7dcdefc3a7cb25655c122e00cf6e636e # v3.1.2
        with:
          cache: true

      - name: Lint files
        run: pnpm exec prettier --check --ignore-unknown .
