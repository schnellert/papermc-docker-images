name: Synchronize

on:
  workflow_call:
    inputs:
      project:
        required: true
        type: string

permissions:
  contents: read

jobs:
  detect-changes:
    name: Detect Changes
    runs-on: ubuntu-26.04

    outputs:
      any: ${{ steps.detect-changes.outputs.any }}
      matrix: ${{ steps.detect-changes.outputs.matrix }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Authenticate with Docker Hub
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          username: schnellert
          password: ${{ secrets.DOCKER_HUB_PAT }}

      - name: Detect Changes
        id: detect-changes
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          PROJECT: ${{ inputs.project }}
        with:
          script: |
            const crypto = require('node:crypto');
            const fs = require('node:fs');

            const project = process.env.PROJECT;
            const baseUrl = `https://fill.papermc.io/v3/projects/${project}`;
            const repository = `docker.io/schnellert/${project}`;
            const platforms = ['linux/amd64', 'linux/arm64'];

            const fetchJson = async (url) => {
              const response = await fetch(url, {
                headers: {
                  'User-Agent': 'github.com/schnellert/papermc-docker-images',
                },
              });

              if (!response.ok) {
                throw new Error(`${url}: HTTP ${response.status}`);
              }

              return response.json();
            };

            const getHash = (file) => crypto
              .createHash('sha256')
              .update(fs.readFileSync(file))
              .digest('hex');

            const runInspect = async (reference, args = []) => {
              const result = await exec.getExecOutput(
                'docker',
                ['buildx', 'imagetools', 'inspect', reference, ...args],
                { ignoreReturnCode: true, silent: true },
              );

              if (result.exitCode === 0) {
                return JSON.parse(result.stdout);
              }

              if (/manifest unknown|name unknown|not found|404 Not Found/i.test(result.stderr)) {
                return null;
              }

              throw new Error(`Cannot inspect ${reference}: ${result.stderr}`);
            };

            const needsBuild = async (version, buildId, hash) => {
              const reference = `${repository}:${version}`;
              const manifest = await runInspect(reference, ['--raw']);

              if (!manifest) return true;

              // Read the image configuration on each target architecture.
              for (const platform of platforms) {
                const format = `{{json (index .Image "${platform}")}}`;
                const image = await runInspect(reference, ['--format', format]);

                if (!image) return true;

                const labels = image.config?.Labels ?? {};
                if (
                  labels["BUILD_ID"] !== String(buildId) ||
                  labels["HASH"] !== hash
                ) {
                  return true;
                }
              }

              return false;
            };

            const pickStableBuild = (builds) => builds.find(
              ({ channel }) => channel === 'STABLE' || channel === 'RECOMMENDED',
            );

            const { versions } = await fetchJson(baseUrl);
            const missing = [];

            for (const candidates of Object.values(versions)) {
              const selected = [];
              let fallback;

              for (const version of candidates) {
                const builds = await fetchJson(`${baseUrl}/versions/${version}/builds`);

                if (!fallback && builds.length) {
                  fallback = { version, build: builds[0] };
                }

                const build = pickStableBuild(builds);
                if (build) selected.push({ version, build });
              }

              if (!selected.length && fallback) selected.push(fallback);

              for (const { version, build } of selected) {
                const { version: metadata } = await fetchJson(
                  `${baseUrl}/versions/${version}`,
                );

                const java = metadata.java.version.minimum;
                const dockerfile = `${project}/Dockerfile.java${java}`;

                if (!fs.existsSync(dockerfile)) {
                  core.info(`Skipping ${version}: ${dockerfile} not found`);
                  continue;
                }

                const hash = getHash(dockerfile);
                if (!(await needsBuild(version, build.id, hash))) {
                  core.info(`${version}: up to date (build ${build.id})`);
                  continue;
                }

                const asset = build.downloads?.['server:default'];
                if (!asset?.url || !asset?.checksums?.sha256) {
                  throw new Error(`Missing download URL or SHA256 for ${version} build ${build.id}`);
                }

                missing.push({
                  version,
                  buildId: String(build.id),
                  java,
                  hash,
                  download: asset.url,
                  sha256: `sha256:${asset.checksums.sha256}`,
                });

                core.info(`${version}: build required (upstream build ${build.id})`);
              }
            }

            if (missing.length > 256) {
              throw new Error(`Build matrix exceeds 256 entries: ${missing.length}`);
            }

            core.setOutput('matrix', JSON.stringify({ include: missing }));
            core.setOutput('any', String(missing.length > 0));
            core.info(missing.length
              ? `${missing.length} images need building:\n${JSON.stringify(missing, null, 2)}`
              : 'All images are up to date.');

  build-push:
    name: Build & Push (${{ matrix.version }})
    runs-on: ubuntu-26.04
    needs: detect-changes
    if: ${{ needs.detect-changes.outputs.any == 'true' }}

    strategy:
      fail-fast: false
      max-parallel: 3
      matrix: ${{ fromJSON(needs.detect-changes.outputs.matrix) }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build & Push
        uses: skriptfabrik/github-actions/build-docker-image@b84cd74840d160c026425667cacefa3e1d483463 # main
        with:
          build-args: |
            DOWNLOAD_URL=${{ matrix.download }}
            SHA256_CHECKSUM=${{ matrix.sha256 }}
          context: ${{ inputs.project }}
          file: Dockerfile.java${{ matrix.java }}
          labels: |
            BUILD_ID=${{ matrix.buildId }}
            HASH=${{ matrix.hash }}
          registry: docker.io
          registry-username: schnellert
          registry-password: ${{ secrets.DOCKER_HUB_PAT }}
          repository: schnellert
          name: ${{ inputs.project }}
          tags: |
            type=raw,value=${{ matrix.version }}
